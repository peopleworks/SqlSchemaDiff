<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <title>SQLDiff — change the shape, keep the rows</title>
  <desc>A table on the left has three rows. SQLDiff emits ALTER TABLE statements that add a column and widen another. The table on the right has the new shape and the same three rows.</desc>
<defs>
