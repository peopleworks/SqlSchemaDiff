  <text x="600" y="140" font-size="10.5" fill="#cc2927" text-anchor="middle" font-weight="800" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" letter-spacing="1.3">SQLDIFF EMITS</text>
  <rect x="412" y="158" width="376" height="156" rx="12" fill="#1e293b"/>
  <text x="430" y="188" font-size="11.5" fill="#fffdf8" text-anchor="start" font-weight="400" font-family="Consolas, Menlo, Monaco, monospace">ALTER TABLE [dbo].[Customer]</text>
  <text x="452" y="209" font-size="11.5" fill="#fbbf24" text-anchor="start" font-weight="400" font-family="Consolas, Menlo, Monaco, monospace">ADD [Tier] tinyint NOT NULL DEFAULT (1);</text>
  <text x="430" y="230" font-size="11.5" fill="#94a3b8" text-anchor="start" font-weight="400" font-family="Consolas, Menlo, Monaco, monospace">GO</text>
  <text x="430" y="251" font-size="11.5" fill="#fffdf8" text-anchor="start" font-weight="400" font-family="Consolas, Menlo, Monaco, monospace">ALTER TABLE [dbo].[Customer]</text>
  <text x="452" y="272" font-size="11.5" fill="#fbbf24" text-anchor="start" font-weight="400" font-family="Consolas, Menlo, Monaco, monospace">ALTER COLUMN [Email] varchar(256) NULL;</text>
  <text x="430" y="293" font-size="11.5" fill="#94a3b8" text-anchor="start" font-weight="400" font-family="Consolas, Menlo, Monaco, monospace">GO</text>
  <text x="600" y="340" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">one transaction — rolls back whole</text>
  <text x="600" y="358" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">nothing dropped unless you ask for it</text>
  <line x1="380" y1="232" x2="404" y2="232" stroke="#1e293b" stroke-width="2.4" marker-end="url(#ah)"/>
  <line x1="796" y1="232" x2="820" y2="232" stroke="#1e293b" stroke-width="2.4" marker-end="url(#ah)"/>
  <rect x="56" y="396" width="1088" height="80" rx="14" fill="#fffdf8" stroke="#cbd5e1" stroke-width="1.6"/>
  <circle cx="100" cy="436.0" r="15" fill="#15803d"/>
  <path d="M93.5,436.5 L98,441.5 L107,430.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="132" y="429" font-size="16" fill="#1e293b" text-anchor="start" font-weight="800" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">No DROP TABLE. No rebuild. No data movement.</text>
  <text x="132" y="453" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">The migration is a plain .sql file you read before you run it — and drift comes back to zero.</text>
