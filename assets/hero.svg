  <text x="600" y="84" font-size="14.5" fill="#cc2927" text-anchor="middle" font-weight="700" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" letter-spacing="2.2">CHANGE THE SHAPE — KEEP THE ROWS</text>
