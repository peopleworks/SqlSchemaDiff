name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test
        run: dotnet test tests/SqlSchemaDiff.Tests/SqlSchemaDiff.Tests.csproj -c Release

      - name: Publish self-contained Windows executable
        run: >
          dotnet publish SqlSchemaDiff.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o ./publish/win-x64

      - name: Publish self-contained Linux executable
        run: >
          dotnet publish SqlSchemaDiff.csproj -c Release -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o ./publish/linux-x64

      # Two packages ship from this repo: the CLI as a .NET tool, and the engine
      # it wraps. The engine has to be on NuGet for the MCP server and DPO to
      # consume it instead of keeping their own forked copies.
      - name: Pack the .NET tool
        run: dotnet pack SqlSchemaDiff.csproj -c Release -o ./artifacts

      - name: Pack the engine library
        run: dotnet pack SqlSchemaDiff.Engine/PeopleWorks.SchemaEngine.csproj -c Release -o ./artifacts

      - name: Zip the executables
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/win-x64/sqldiff.exe -DestinationPath ./artifacts/sqldiff-win-x64.zip
          Compress-Archive -Path ./publish/linux-x64/sqldiff -DestinationPath ./artifacts/sqldiff-linux-x64.zip

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/*.zip
            ./artifacts/*.nupkg
          generate_release_notes: true

      # Set the NUGET_API_KEY secret to publish; the step is skipped without it.
      # The secrets context is not available to a step-level `if`, so the value is
      # read through env, which is.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        if: env.NUGET_API_KEY != ''
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key $env:NUGET_API_KEY
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
